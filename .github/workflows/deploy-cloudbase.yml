name: Deploy to CloudBase CloudRun

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CloudBase CLI
        run: npm i -g @cloudbase/cli

      - name: Login (CI apiKey)
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy CloudRun service
        # printf '\n' 跳过「是否启用灰度部署」交互提示（默认否=全量发布）
        run: printf '\n' | tcb cloudrun deploy --service-name offercheck --port 8000 --force --wait -e cloud-d1g9ju6z1773593f1
